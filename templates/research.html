{% extends "base.html" %}

{% block content %}
<article class="research">
  <h1>{{ page.title }}</h1>
  {% if page.extra.lede %}
  <p class="research-lede">{{ page.extra.lede }}</p>
  {% endif %}
  {% if page.extra.questions %}
  <nav class="research-questions" aria-label="Questions on this page">
    {% for q in page.extra.questions %}
    <a href="#{{ q.id }}"><span class="q-num">{{ loop.index }}</span>{{ q.text }}</a>
    {% endfor %}
  </nav>
  {% endif %}
  {{ page.content | safe }}
</article>
{% endblock content %}
